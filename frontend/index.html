<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dispatch AI - Intelligent AI Prompt Router">
    <title>Dispatch AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Display:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Interactive Dot Grid -->
    <div class="dot-grid"></div>
    <div class="dot-grid-interactive" id="dot-grid-interactive"></div>

    <!-- Top Navigation Bar -->
    <header class="top-bar" id="top-bar">
        <div class="top-bar-left">
            <div class="avatar" id="user-avatar" onclick="window.location.href='profile.html'" title="Profile">S</div>
            <button class="top-icon-btn" id="settings-btn-main" title="General Settings" onclick="window.location.href='settings.html'">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 21v-7m0-4V3m8 18v-9m0-4V3m8 18v-5m0-4V3M1 14h6m2-6h6m2 8h6"/></svg>
            </button>
        </div>
        <div class="top-bar-right">
            <button class="top-icon-btn has-label primary-nav active-nav" id="new-chat-top-btn" title="Chats" onclick="window.location.href='index.html?fresh=1'">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                <span class="btn-label">Chats</span>
            </button>
            <button class="top-icon-btn has-label" id="models-top-btn" title="Models" onclick="window.location.href='models.html'">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                <span class="btn-label">Models</span>
            </button>
            <button class="top-icon-btn has-label" id="analytics-top-btn" title="Analytics" onclick="window.location.href='analytics.html'">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg>
                <span class="btn-label">Analytics</span>
            </button>
            <button class="top-icon-btn has-label" id="history-top-btn" title="History" onclick="window.location.href='history.html'">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                <span class="btn-label">History</span>
            </button>
        </div>
    </header>

    <div class="app-layout">
        <!-- Left Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-tabs">
                    <button class="sidebar-tab active" id="new-chats-tab" onclick="window.location.href='index.html?fresh=1'">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>
                        <span class="sidebar-tab-label">Chats</span>
                    </button>
                </div>
                <button class="sidebar-collapse-btn" id="sidebar-collapse-btn" title="Collapse sidebar">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
            </div>

            <div class="sidebar-section" style="margin-top: 16px;">
                <h3 class="sidebar-section-title">Your Prompts</h3>
                <div id="analytics-prompt-list" style="display: flex; flex-direction: column; gap: 12px; margin-top: 12px;">
                    <!-- JS populated -->
                    <div style="color: var(--text-secondary); text-align: center; padding: 24px; font-size: 14px;">No prompts yet.</div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content" id="main-content">
            <!-- Welcome Text Animation -->
            <div class="welcome-wrapper" id="welcome-wrapper" style="height: 120px; position: relative;">
                <canvas id="welcome-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></canvas>
            </div>

            <!-- Prompt Area (Stitch-style input box) -->
            <div class="prompt-container" id="prompt-container">
                <textarea class="prompt-input" id="prompt-input" placeholder="Enter your prompt here..." rows="2"></textarea>
                <div class="prompt-actions">
                    <div class="prompt-left-actions">
                        <button class="add-btn" id="add-btn" title="Attach files" type="button">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        </button>
                        <div class="popup-container">
                            <button class="action-icon-btn" id="options-popup-btn" title="Format Options" type="button">
                                <!-- Spiral Logo (Aperture / Abstract) -->
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e3e3e3" stroke-width="1.2">
                                    <circle cx="12" cy="12" r="10" />
                                    <path d="M12 2C7 6 6 12 12 22" />
                                    <path d="M22 12C18 7 12 6 2 12" />
                                    <path d="M19 5C14 8 10 12 19 19" />
                                    <path d="M5 19C10 16 14 12 5 5" />
                                </svg>
                            </button>
                            <div class="options-menu" id="options-menu">
                                <button class="action-text-btn" data-refinement="bullet" type="button">Bullets</button>
                                <button class="action-text-btn" data-refinement="brief" type="button">Brief</button>
                                <button class="action-text-btn" data-refinement="detailed" type="button">Detailed</button>
                            </div>
                        </div>
                    </div>
                    <div class="prompt-right-actions">
                        <button class="go-btn" id="go-btn">
                            GO
                        </button>
                    </div>
                </div>
                <input type="file" id="file-input" class="hidden-file-input" multiple accept=".txt,.md,.py,.js,.ts,.tsx,.jsx,.json,.html,.css,.csv,.xml,.yaml,.yml,.java,.c,.cpp,.h,.hpp,.rs,.go,.sql,.sh,.log">
                <div class="attachment-list" id="attachment-list"></div>
            </div>

            <!-- Response Area (from Dispatch AI image 2) -->
            <div class="response-area" id="response-area">
                <div class="model-response-card" id="model-response-card">
                    <div class="response-header">
                        <span class="response-label">MODEL RESPONSE</span>
                        <span class="response-status">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="#34a853"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                            Ready
                        </span>
                    </div>
                    <div class="response-body">
                        <div class="skeleton-line w80"></div>
                        <div class="skeleton-line w100"></div>
                        <div class="skeleton-line w90"></div>
                        <div class="skeleton-line w65"></div>
                    </div>
                </div>
                <div class="route-path-card" id="route-path-card">
                    <span class="route-label">ROUTING</span>
                    <h2 class="route-model">Dispatch Router</h2>
                    <p class="route-desc">Ready • Brief</p>
                    <div class="route-speed">
                        <span class="speed-label">Latency</span>
                        <span class="speed-value">0ms</span>
                    </div>
                    <div class="speed-bar">
                        <div class="speed-bar-fill"></div>
                    </div>
                </div>
            </div>

            <!-- Bottom Toolbar Removed -->
        </main>
    </div>

    <script>
    window.MathJax = {
        tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)']],
            displayMath: [['$$', '$$'], ['\\[', '\\]']],
            processEscapes: true
        },
        options: {
            skipHtmlTags: { '[+]': ['pre', 'code'] }
        }
    };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>
    <script src="script.js"></script>
    <script>
    (function() {
        const canvas = document.getElementById('welcome-canvas');
        if (!canvas) return;

        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        let particles = [];
        let solidText = null;

        function initCanvas() {
            const wrapper = canvas.parentElement;
            canvas.width  = wrapper.clientWidth  || 800;
            canvas.height = wrapper.clientHeight || 120;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            ctx.font = 'bold 48px "Google Sans Display", Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('Welcome to Dispatch', canvas.width / 2, canvas.height / 2);

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const pts = [];

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let y = 0; y < canvas.height; y += 3) {
                for (let x = 0; x < canvas.width; x += 3) {
                    if (data[(y * canvas.width + x) * 4 + 3] > 128) {
                        pts.push({
                            originX: x, originY: y,
                            x: x + (Math.random() - 0.5) * canvas.width * 1.8,
                            y: y + (Math.random() - 0.5) * canvas.height * 6
                        });
                    }
                }
            }
            return pts;
        }

        let startTime = null;
        const DURATION = 2000;

        function animate(ts) {
            if (!startTime) startTime = ts;
            let t = Math.min((ts - startTime) / DURATION, 1);
            // easeOutExpo
            const e = t === 1 ? 1 : 1 - Math.pow(2, -10 * t);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            ctx.beginPath();
            for (const p of particles) {
                const cx = p.x + (p.originX - p.x) * e;
                const cy = p.y + (p.originY - p.y) * e;
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, 1.2, 0, Math.PI * 2);
            }
            ctx.fill();

            if (t < 1) {
                requestAnimationFrame(animate);
            } else {
                // Fade canvas out, show bold solid text
                canvas.style.transition = 'opacity 0.35s ease';
                canvas.style.opacity = '0';
                solidText.style.opacity = '1';
            }
        }

        window.addEventListener('load', () => {
            // Create final solid bold text overlay
            solidText = document.createElement('h1');
            solidText.textContent = 'Welcome to Dispatch';
            Object.assign(solidText.style, {
                position: 'absolute', top: '50%', left: '50%',
                transform: 'translate(-50%, -50%)',
                margin: '0', width: '100%', textAlign: 'center',
                fontSize: '48px', fontWeight: '700',
                fontFamily: '"Google Sans Display", Arial, sans-serif',
                color: 'white', opacity: '0',
                transition: 'opacity 0.35s ease',
                zIndex: '2', pointerEvents: 'none'
            });
            canvas.parentElement.style.position = 'relative';
            canvas.parentElement.appendChild(solidText);

            particles = initCanvas();
            if (particles.length > 0) {
                requestAnimationFrame(animate);
            } else {
                solidText.style.opacity = '1';
            }
        });
    })();
    </script>
</body>
</html>
